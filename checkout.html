<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">

<style>

/* Background Animation */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(270deg,#6a11cb,#2575fc,#ff6a00,#ee0979);
background-size:800% 800%;
animation: gradientBG 12s ease infinite;
font-family:'Segoe UI',sans-serif;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Checkout Card */

.checkout-box{
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
width:400px;
animation: slideUp 1s ease;
}

@keyframes slideUp{
from{
opacity:0;
transform:translateY(50px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.form-control{
border-radius:8px;
transition:0.3s;
}

.form-control:focus{
box-shadow:0 0 10px #2575fc;
border-color:#2575fc;
}

.btn-success{
width:100%;
border-radius:30px;
padding:10px;
font-size:18px;
transition:0.4s;
}

.btn-success:hover{
transform:scale(1.05);
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

h2{
text-align:center;
margin-bottom:25px;
font-weight:bold;
}

/* Popup Style */

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
}

.popup-content{
background:white;
padding:40px;
border-radius:10px;
text-align:center;
animation: popupAnim 0.5s ease;
}

@keyframes popupAnim{
from{
transform:scale(0.5);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

</style>

</head>

<body>

<div class="checkout-box">

<h2>Checkout</h2>

<form id="orderForm" onsubmit="showPopup(event)">

<div class="form-group">
<label>Full Name</label>
<input type="text" class="form-control" required>
</div>

<div class="form-group">
<label>Address</label>
<textarea class="form-control" required></textarea>
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="text" class="form-control" required>
</div>

<div class="form-group">
<label>Payment Method</label>
<select class="form-control">
<option>Cash on Delivery</option>
<option>UPI</option>
<option>Card</option>
</select>
</div>

<button class="btn btn-success">Place Order</button>

</form>

</div>

<!-- Popup Message -->

<div class="popup" id="popup">

<div class="popup-content">

<h2>🎉 Thank You!</h2>

<p>Your order has been placed successfully.</p>

<button class="btn btn-primary" onclick="closePopup()">Close</button>

</div>

</div>

<script>

function showPopup(event){
event.preventDefault();
document.getElementById("popup").style.display="flex";
}

function closePopup(){
document.getElementById("popup").style.display="none";

/* Clear Form */

document.getElementById("orderForm").reset();
}

</script>

</body>
</html>
